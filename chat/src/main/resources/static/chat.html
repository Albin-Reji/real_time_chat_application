<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Real-time Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body class="theme-light"> <!-- default theme -->

<div class="chat-container">

    <div class="header">
        <h2>💬 Real-time Chat</h2>

        <!-- Theme Select -->
        <select id="themeSelector" class="theme-select">
            <option value="theme-light">☀️ Light</option>
            <option value="theme-dark">🌙 Dark</option>
        </select>
    </div>

    <div id="connection" class="connection-box">
        <input type="text" id="username" placeholder="Enter your name">
        <button id="connectBtn" class="btn connect">Connect</button>
        <button id="disconnectBtn" class="btn disconnect" disabled>Disconnect</button>
    </div>

    <div id="chat" class="chat-area hidden">

        <div id="messages" class="messages"></div>

        <form id="messageForm" class="message-box">

            <!-- Emoji Button -->
            <button type="button" id="emojiBtn" class="emoji-btn">😊</button>

            <!-- Emoji Picker -->
            <div id="emojiPicker" class="emoji-picker hidden"></div>

            <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off"/>

            <button type="submit" class="btn send">Send</button>
        </form>

    </div>
</div>

<!-- Sound -->
<audio id="sentSound" src="/sounds/sent.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script src="/js/chat.js"></script>

</body>
</html>
